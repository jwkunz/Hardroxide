[package]
name = "hardroxide-ps7"
description = "Zynq-7000 processing-system support for bare metal: startup, exceptions, GIC, timers, UART console"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["default-irq-entry", "default-svc-entry"]
# Provide a `#[panic_handler]` that prints the panic on the console and halts.
panic-handler = []
# The default (non-nesting) IRQ vector entry. The RTOS kernel turns this off and
# supplies its own, scheduler-aware entry.
default-irq-entry = []
# The default supervisor-call entry (reports it as unhandled). The kernel supplies its own.
default-svc-entry = []
# `impl hardroxide_net::Device for Gem`, so the network stack can run on the Ethernet MAC.
net = ["dep:hardroxide-net"]

[dependencies]
hardroxide-mmio = { workspace = true, features = ["physmem"] }
hardroxide-irq.workspace = true
embedded-hal.workspace = true
thiserror.workspace = true
hardroxide-net = { workspace = true, optional = true }

[dev-dependencies]
hardroxide-mmio = { workspace = true, features = ["std"] }
