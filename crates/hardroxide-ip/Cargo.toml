[package]
name = "hardroxide-ip"
description = "Curated drivers for Xilinx IP, keyed by VLNV"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
# Linux/host: `io::Write` for the UART, the std time source, the Linux halves of the
# dma/irq crates; also enables `alloc`.
std = ["alloc", "hardroxide-mmio/std", "hardroxide-dma/std", "hardroxide-irq/std", "thiserror/std"]
# `Vec`-returning conveniences (the FIFO's `recv`); everything else is allocation-free.
alloc = []

[dependencies]
hardroxide-mmio.workspace = true
thiserror.workspace = true
hardroxide-dma.workspace = true
hardroxide-irq.workspace = true
embedded-hal.workspace = true

[dev-dependencies]
hardroxide-hwh.workspace = true
