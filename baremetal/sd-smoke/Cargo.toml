[package]
name = "sd-smoke"
version = "0.0.0"
edition = "2024"
publish = false

# A standalone workspace: this builds for the bare-metal target, not the host.
[workspace]

[features]
# Run under QEMU's xilinx-zynq-a9 machine (does the PLL/UART-clock setup ps7_init would). The "card" is a
# throwaway disk image, so the program may format it.
qemu = []

[dependencies]
hardroxide-ps7 = { path = "../../crates/hardroxide-ps7", features = ["panic-handler"] }
hardroxide-mmio = { path = "../../crates/hardroxide-mmio", default-features = false, features = ["physmem"] }
hardroxide-fat = { path = "../../crates/hardroxide-fat" }

[build-dependencies]
hardroxide-ps7 = { path = "../../crates/hardroxide-ps7" }

[profile.release]
panic = "abort"
opt-level = "s"
debug = true

[profile.dev]
panic = "abort"
