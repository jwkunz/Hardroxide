[package]
name = "hardroxide-rt"
description = "A FreeRTOS-style real-time kernel for Zynq-7000 (Cortex-A9) and Zynq UltraScale+ (Cortex-A53): priority-preemptive tasks, semaphores, mutexes with priority inheritance, queues"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
hardroxide-mmio = { workspace = true, features = ["physmem"] }

[target.'cfg(any(target_arch = "arm", target_arch = "aarch64"))'.dependencies]
hardroxide-irq.workspace = true

# The processor support for the target: start-up, interrupt controller and tick. Its default interrupt entries are turned
# off: this crate provides its own, scheduler-aware ones.
[target.'cfg(target_arch = "arm")'.dependencies]
hardroxide-ps7 = { workspace = true, default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
hardroxide-psu = { workspace = true, default-features = false }
