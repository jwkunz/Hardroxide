[package]
name = "hardroxide-fpga"
description = "Bitstream loading and PL clock control via Linux fpga_manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["std"]
std = ["dep:sha2", "hardroxide-mmio/std", "thiserror/std"]

[dependencies]
thiserror.workspace = true
hardroxide-mmio = { workspace = true, default-features = false }
sha2 = { workspace = true, optional = true }
