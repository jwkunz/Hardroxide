[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jwkunz/Hardroxide"

[workspace.dependencies]
thiserror = "2"
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
