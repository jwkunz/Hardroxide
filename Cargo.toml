[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jwkunz/Hardroxide"

[workspace.dependencies]
thiserror = "2"
roxmltree = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hardroxide-hwh = { path = "crates/hardroxide-hwh" }
hardroxide-mmio = { path = "crates/hardroxide-mmio" }
hardroxide-fpga = { path = "crates/hardroxide-fpga" }
hardroxide-ip = { path = "crates/hardroxide-ip" }
hardroxide-gen = { path = "crates/hardroxide-gen" }
hardroxide-dma = { path = "crates/hardroxide-dma" }
hardroxide-irq = { path = "crates/hardroxide-irq" }
